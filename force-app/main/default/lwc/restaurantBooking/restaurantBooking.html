<template>
  <div class="date-header">
    <lightning-button label="Previous Day" title="Previous Day" icon-name="action:back" onclick={handlePreviousDay}></lightning-button>
    <div class="slds-text-heading_medium">{dateDisplayedLabel}</div>
    <lightning-button label="Next Day" title="Next Day" icon-name="utility:forward" onclick={handleNextDay} icon-position="right" ></lightning-button>
  </div>
  <template lwc:if={isLoading}>
    <div class="slds-is-relative slds-p-around_large">
      <lightning-spinner alternative-text="Loading availability" size="small"></lightning-spinner>
    </div>
  </template>
  <template lwc:if={errorMessage}>
    <p class="slds-text-color_error slds-m-top_small" role="alert">{errorMessage}</p>
  </template>
  <template lwc:if={hasNoSlots}>
    <p class="slds-text-color_weak slds-m-top_small">No availability on this day. Try another date.</p>
  </template>
  <template lwc:if={hasSlots}>
    <fieldset class="slds-form-element" role="radiogroup">
      <legend class="slds-form-element__legend slds-form-element__label">Available Times</legend>
      <template for:each={availableTimes} for:item="time">
        <div key={time} class="slds-form-element__control slds-m-bottom_medium">
          <div class="slds-visual-picker slds-visual-picker_vertical">
            <input type="radio" id={time} value={time} name="booking-times" onchange={handleRadioChange} />
            <label for={time}>
              <span class="slds-visual-picker__figure slds-visual-picker__text slds-align_absolute-center">
                <span>
                  <span class="slds-text-heading_large">{time}</span>
                </span>
              </span>
              <span class="slds-icon_container slds-visual-picker__text-check">
                <lightning-icon icon-name="utility:check" size="x-small" alternative-text="Selected" title="Selected" variant="inverse"></lightning-icon>
              </span>
            </label>
          </div>
        </div>
      </template>
    </fieldset>
  </template>
</template>
