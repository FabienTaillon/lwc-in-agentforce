<template>
  <lightning-modal-header label={restaurantName}></lightning-modal-header>
  <lightning-modal-body>
    <c-restaurant-booking record-id={recordId} onselected={handleSelection}></c-restaurant-booking>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
    <lightning-button label="Book" variant="brand" class="slds-m-left_x-small" disabled={buttonDisabled} onclick={handleBook}></lightning-button>
  </lightning-modal-footer>
</template>
